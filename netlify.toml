[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# NOTE: the frontend calls the Render API directly (cross-origin) using the
# build-time env var VITE_API_BASE (src/App.jsx -> apiUrl()). The server allow-lists
# this Netlify origin via CLIENT_ORIGIN (CORS). Netlify cannot substitute env vars
# in redirect destinations, so a /api proxy redirect here would always 404.

# SPA fallback: send every other route to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
