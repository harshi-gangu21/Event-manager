[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy API calls to the Render backend.
# Requires API_BASE_URL in Netlify env vars (no trailing slash), set BEFORE deploying.
[[redirects]]
  from = "/api/*"
  to = ":API_BASE_URL/api/:splat"
  status = 200
  force = true

# SPA fallback: send every other route to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
